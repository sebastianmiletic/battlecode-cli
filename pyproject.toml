[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battlecode-cli"
version = "0.4.0"
description = "Local browser and terminal dashboards with official sandbox simulations for UNSW Battlecode."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sebastian Miletic" }]
dependencies = [
    "textual>=8.2.8,<9",
    "httpx>=0.28,<1",
    "platformdirs>=4,<5",
    "keyring>=25,<26",
    "filelock>=3.18,<4",
]

[project.scripts]
battlecode-cli = "battlecode_cli.cli:main"
battlecode = "battlecode_cli.cli:main"

[project.urls]
Repository = "https://github.com/sebastianmiletic/battlecode-cli"
Documentation = "https://game.battlecode.au/docs/api"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2.3", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/battlecode_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 90

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
